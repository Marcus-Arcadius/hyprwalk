# sound_check.sh's clients (sound_test, pw-record, pw-link), through PIPEWIRE_CONFIG_DIR: as the usual client.conf, but
# without RT (nothing asks the desktop's RTKit) and with streams setting up their own ports (adapter.auto-port-config,
# as a session manager would), so they can be linked by hand
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
stream.properties = {
    adapter.auto-port-config = { mode = dsp }
}
