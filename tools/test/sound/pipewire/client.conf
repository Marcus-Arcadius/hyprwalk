# client.conf for sound_check.sh's clients (through PIPEWIRE_CONFIG_DIR): no RT (nothing asks the desktop's RTKit), and
# streams set up their own ports (adapter.auto-port-config, as a session manager would) so they can be linked by hand
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
stream.properties = {
    adapter.auto-port-config = { mode = dsp }
}
